# ==================== MovieClaw 演示版本 Docker Compose ====================
# 【演示版本】一键启动配置
# 包含：前端应用、可选的反向代理
# ==========================================================================

version: "3.8"

services:
  # 前端应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieclaw-app
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - movieclaw-network

  # 【可选】反向代理服务（生产环境建议启用）
  # nginx-proxy:
  #   image: nginx:alpine
  #   container_name: movieclaw-proxy
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   restart: unless-stopped
  #   networks:
  #     - movieclaw-network

networks:
  movieclaw-network:
    driver: bridge
