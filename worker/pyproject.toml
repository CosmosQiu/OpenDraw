[project]
name = "movie_claw_worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=23.0.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "ruff>=0.11.0",
    "uvicorn[standard]>=0.27.0",
]


[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[project.scripts]
server = "src.run_server:main"
#server_gunicorn = "src.run_server_gunicorn:main"
#celery_worker = "src.run_celery:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"